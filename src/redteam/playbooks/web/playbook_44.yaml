id: web-044
name: "入侵痕跡(IOC)唯讀判讀與『轉通報即停火』條件:疑似已遭入侵資產的取證型紀律"
owasp: A01/A05 (OWASP Top10 2025 交叉;取證型方法論)
target_type: web_service
phase: verify
payload_policy: methodology-only
side_effect_free: true

summary: >
  公開通報案例中出現『漏洞＋已發現入侵痕跡』的複合敘事,且全為嚴重級——防禦缺口是低成熟度
  資產(產業入口／NPO／中小企業後台)無專職人員、無日誌留存,『痕跡判讀』成為唯一可行的高價值
  產出。本劇是 KB 首本『防禦取證型』劇本:定義看到疑似已遭入侵(後門/webshell 殘留)的跡象時,agent 如何做純唯讀
  判讀、在什麼條件下停火。核心停火條件:一旦判定疑似已入侵 → 該資產轉通報優先、停止一切後續
  探測——繼續深入可能破壞第三方證據鏈,且已超出驗證範圍。攻擊型劇本沒有的『因防護缺口外的
  理由中止測試』機制,在本劇明文化。

steps:
  - recon: "痕跡線索只來自既有測試的自然產物(目錄清單、上傳目錄列表、錯誤頁),不為取證目的新增任何探測。觀察邊界=清單層級:副檔名分布、檔名結構、時間戳簇、檔名可預測性(工具自動產製的高熵隨機名 vs 人工命名)。全程不下載、不請求、不執行任何可疑檔案,嚴禁觸發可能驅動 shell 的參數。"
  - probe: "差異比對判讀(純唯讀):同目錄合法資產當基準——副檔名異常(同批次正常上傳為圖檔、混入腳本副檔名)、時間戳簇異常(單獨檔案的時間與同批上傳明顯不同)、檔名形態為可預測隨機(工具產製特徵)。判讀邊界鐵律:僅在既有回應文本內判讀,不另發請求取得檔案內容。"
  - note: "停火條件(核心機制,明文化):1)判定『疑似已遭入侵』→ 該資產立即轉通報優先,停止一切後續探測(含其他缺陷族的例行掃描),理由:可能破壞第三方證據鏈+已非驗證範圍;2)『檔案存在』≠『webshell』,『目錄可列』≠『已被入侵』——無跨時點對照(同一目錄兩週前的清單)時,一律標 CANDIDATE＋影響面推論,嚴禁 CONFIRM 入侵;3)通報敘事只寫跡象類別與位置,不落盤可疑檔案內容本身(第三人攻擊產物不入報告/工作區)。"
  - note: "與攻擊型劇本的分工:web-043(元件暴露)或任何劇本命中暴露面後,若上傳目錄出現本劇跡象 → 該資產的後續探測佇列全部清空,轉本劇取證流程;未見跡象才繼續常規驗證。停火判定本身也要防呆:CMS 快取檔、備份檔、套件升級殘留都是時間戳異常的無辜解釋,單一異常不構成立案基礎,需兩類以上跡象同現。"
  - reference: "『漏洞＋入侵痕跡』複合嚴重案例蒸餾自台灣漏洞通報平台之公開通報案例(產業資訊入口、企業後台、社福團體站;受害識別資訊已全部去識別化,不含可反向關聯之通報流水號)。IOC 判讀思路參考一般取證常識(基準比對、時間戳簇、檔名熵),不引用特定事件。修復與應變:先備份日誌與檔案清單再清理、建立上傳目錄白名單監控、修復入口缺陷本身(痕跡是果不是因)。"
