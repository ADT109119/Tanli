id: web-023
name: "XSS 三形態全譜:反射/儲存/DOM 與上下文繞過(含 SPA 時代)"
owasp: A05 (OWASP Top10 2025;XSS 由 2021 A03 併入注入類)
target_type: web_service
phase: inject
payload_policy: methodology-only
side_effect_free: true

summary: >
  操作者文件提煉(三形態對照表)。XSS 本質:伺服器對未信任輸入的渲染打破了 HTML
  解析上下文邊界,瀏覽器無法區分開發者腳本與注入腳本——注入碼享有 Origin 下
  完整權限(DOM、Session Cookie、背景 API 呼叫)。三形態的差異在『載荷傳播路徑』:
  (1)反射型:URL 參數即時傳入、單次觸發,載荷生命週期最短、WAF 最易攔;
  (2)儲存型:寫入持久層(留言板/設定檔),每個訪問者都成受害者——蠕蟲化、
  管理員面板 XSS = 後台憑證遭勒索;
  (3)DOM 型:純客戶端 Source→Sink(window.location.hash → innerHTML/eval),
  伺服器端不經手 => 傳統 WAF 全盲,SPA 時代主戰場。
  防禦核心(文件):上下文相關輸出轉義(HTML body/屬性/JS 字面量/URL/CSS 各自對應
  編碼)、CSP 禁未 nonce 內聯腳本+eval、Cookie HttpOnly 杜絕 DOM 竊取會話。
  web-013 管 sanitizer 組件層,本劇本管「渲染邊界」全景,二者互補。

steps:
  - recon: "Source/Sink 盤點(被動):從 JS bundle 找危險 sink——innerHTML/outerHTML/document.write/eval/setTimeout 字串參數/location 操縱;URL 參數、hash、postMessage 監聽器為 Source 清單。DOM 型 XSS 是『讀碼就能發現』的漏洞,零互動成本。"
  - recon: "教育/社團/活動報名類系統的常見儲存點清單(公開通報案例顯示此族群反覆中招):申請備註/感言/需求說明/補件說明/申覆理由等外部可提交自由文字欄、附件上傳的檔名(顯示時常未轉義)、富文本(WYSIWYG)編輯器欄位(表單過濾≠編輯器產出過濾;編輯器產出面若為第三方內嵌元件,轉 web-043 做元件面盤點與 connector 輔助端點檢查)、簽到欄、社團/活動名稱與簡介——這些外部輸入最終都渲染在『管理面板』上下文裡,正是權限層最高的觸發環境。注意角色方向:審核意見欄是審核者寫給申請者看的,其威脅方向相反(渲染於學生端),盤點時別混入外部輸入清單。"
  - probe: "反射點探測(benign marker 鐵律):送唯一字母數字 token 觀察回顯位置與上下文(HTML body?屬性內?script 內字面量?JS 變數?)。回顯上下文決定轉義缺口:在 <script>var x='TOKEN' 內 => 跳脫引號即執行環境;在屬性內 => 檢查引號/事件屬性是否過濾。僅用字母 token 與無害探測,不投遞 script 標籤。"
  - probe: "CSP 評估(被動,站方防護盤點):取 CSP 標頭分析——有無 unsafe-inline/unsafe-eval、nonce/hash 策略、report-uri 是否存在、frame-ancestors 覆蓋。CSP 缺失或含 unsafe-inline 時,任何注入點的利用成本驟降(與實地觀測 medium finding 同源)。"
  - verify: "儲存型/DOM 型的確認僅在自有帳號/自有靶場:自有帳號寫入 benign marker,另一自有帳號觀看觀察回顯(不打 cookie、不呼叫真實 API、不碰他人帳號)。SPA 前端路由的 hash/source 處理用本地靶場復刻驗證,不在生產執行。"
  - note: "報告敘事要點:XSS 的 CVSS 取決於(1)觸發者權限層(管理員面板 XSS >> 訪客頁)(2)載荷生命週期(儲存型蠕蟲 > 反射型一次性)(3)敏感 API 可達性(同 Origin 可呼的 API 面)。同樣一個回顯,敘述這三點分數差兩級。學校系所/學生會/社團系統語境的敘事模板:此類系統由學生自治組織維護、無專職資安人力,儲存型 XSS 落點在審核/管理面板 => 觸發者為指導老師或幹部帳號,後台憑證遭竊後攻擊者可竄改活動名單、群發詐騙通知(同 Origin 可呼全部表單 API),且系統常掛學校網域——可信網域下的釣魚放大效應。敘事把『權限層+維護能量+網域信任』三軸寫全,分數才不會被當一般訪客頁 XSS 低估。"
  - reference: "來源:操作者文件 Common_Web_Attack_Techniques.md(XSS 三形態表+防禦深度段),OWASP Top10:2025;PortSwigger XSS 章節、DOM-based XSS 專題(DOMPURIFY 繞過見 web-013)。修復:上下文轉義庫(輸出編碼由輸出點決定,非輸入過濾)、CSP nonce 模式、Cookie HttpOnly+SameSite、前端 Trusted Types(阻斷 sink 面)。"
