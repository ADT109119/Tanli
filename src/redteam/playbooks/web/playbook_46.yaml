id: web-046
name: "認證後授權真空盤點:汰換／新上線業務系統的前端角色宣稱差分與特殊類別資料暴露(A01)"
owasp: A01 (OWASP Top10 2025 Broken Access Control;換版期特有時序面)
target_type: web_service
phase: verify
payload_policy: methodology-only
side_effect_free: true

summary: >
  系統性漏報區:未登入態閘門差分(web-036)全數回絕≠安全——有一類破口只存在於『合法低權帳號
  通過認證之後』,即認證後授權真空。觸發時機是業務系統汰換/新平台上線期(校務、學務、
  獎助學金、公部門、企業 ERP/CRM 換版),授權模型重寫而權限矩陣常未回歸驗證。
  核心手法『前端角色宣稱差分』:前端 bundle 的 role→選單/路由映射就是站方自己寫下的授權宣稱,
  與後端 API 實際行為對照,零副作用即可立案。三個成因:授權只做在前端選單、資料遷移把歷史留存
  population(已離校/已退職)整批搬過去、庫內含特殊類別標籤(弱勢標記)/財務欄/識別碼。

steps:
  - recon: "汰換／新上線時機指紋(純被動):產品名帶年份或『新系統/新版』文案、上線公告與切換通知、舊站 301 重導向、新舊雙站並存、URL 路徑出現代際差異(同一功能新舊兩套路徑)、前端框架代際跳變(舊站 jQuery 時代產物→新站 SPA 打包)。命中=該站處於換版窗口,授權模型重寫而權限矩陣常未回歸驗證,本劇升級為優先劇本。"
  - recon: "前端角色宣稱抽取(純被動):從 JS bundle 抓 role/authority/permission 陣列、選單樹(菜單/menuList/nav 語義結構)、路由守衛表(role→path 對應)。這份映射是站方自己寫下的『哪些角色可以做什麼』宣稱,直接作為差分基準,不需要任何探測即取得。注意坑:選單由後端 API 下發而非寫死在 bundle 時,改以該選單 API 的回應結構為基準(仍屬自有帳號下的被動觀察)。"
  - probe: "前端宣稱 vs 後端行為差分(核心手法,自有合法帳號、唯讀):前置方法閘門——僅對 GET/查詢類唯讀端點發包,POST/PUT/PATCH/DELETE 一律不發(轉 web-020 缺失性觀察)。以自己帳號實際持有的角色為基準,對『前端已對該角色隱藏/未渲染』的唯讀端點各發一次最小外形請求(參數填自有識別值或明顯假值)。"
  - probe: "差分判定的 SPA 兜底防呆:回應 200 但 Content-Type 為 text/html 且內容是 index.html 模板者,屬前端路由兜底而非後端放行,不得立案;必須確認回應為 application/json 等業務資料結構。前端不提供入口、後端卻回業務結構,才是授權只做在瀏覽器的直接證據。"
  - probe: "差分紅線(立案即停):嚴禁以任何他人帳號、共用帳號或他人在籍識別碼發起請求;跨帳號實讀一律禁止,一讀即越權。命中後不再對同端點續取深層資料,改以欄位名稱與形態做影響面敘事。"
  - probe: "欄位定級三軸(立案加重):回應欄位命中任一即為加重軸——(a)識別碼(身分證/戶籍類結構,見 web-037 識別碼結構可推性防呆)、(b)財務欄(銀行帳號/薪轉/補助金額)、(c)特殊類別身分註記或弱勢標記欄(申請類別、審核狀態、自陳說明類自由文字欄)。教育產業任一命中 High 起談,與 web-042 產業定錨綁定。"
  - verify: "差分證據成形即停(零副作用立案):證據=自有帳號下的兩組封包對照(前端宣稱截圖/路由表片段 + 後端實際回應形態),欄位值僅留名稱與形態。寫入、修改、刪除類端點一律不發請求,僅以路由存在性與方法變體回應碼做缺失性觀察並標 pending-approval(做法轉 web-020 破壞性寫入立案步驟)。"
  - note: "定級用詞防呆(避免被打退件):弱勢助學/低收入戶自陳屬『高敏感度非特種個資』,不是個資法第 6 條法定特種個資(該六類見 web-042)——敘事寫『高敏感身份註記與弱勢自陳個資』,嚴禁掛特種個資名目。自由文字欄是申請人自陳內容,敏感度要單列一級,不得當成一般備註欄。"
  - note: "歷史留存 population 影響面敘事(換版期專屬):遷移把『已離校/已退職/已完約』的舊紀錄一併搬進新系統,而新系統的授權宣稱通常只描述現行身分,於是破口影響母體包含已非在籍者——他們的個資與財務欄仍在庫、且最不可能察覺外洩、也最無從主張權利。影響面要寫成『現行+歷史留存母體』兩段,而不是只寫目前的人數。"
  - note: "修復敘事要寫對根因(避免只建議補選單):根因是授權邊界被實作在客戶端。修復=後端每個端點以 session 內身分與角色重新授權(deny-by-default)、前端選單退為純粹顯示層;換版專案驗收應含『權限矩陣回歸測試』(每一角色×每一端點的正反兩向斷言),且資料遷移時重估歷史留存資料的必要欄位與保存期限(能不相帶的欄位就不要搬)。"
  - note: "交叉引用:未登入態閘門差分(web-036)全數回絕不得判定安全,須續跑本劇的認證後差分——這是 web-036 現行方法論的漏報區。定級與產業加權轉 web-042,欄位敏感度分級轉 web-037。"
  - reference: "本劇蒸餾自台灣漏洞通報平台之公開通報案例(大專校院校務系統換版期,單一低權帳號可讀取在學與離校學生之金融帳戶欄、可讀取不利處境就學補助申請者自陳個資,並可未授權刪除他人減免申請紀錄;受害識別資訊已全部去識別化,不含可反向關聯之通報流水號)。"
