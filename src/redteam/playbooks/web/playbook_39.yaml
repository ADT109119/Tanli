id: web-039
name: "行銷機制狀態機缺陷:邀請碼/優惠券/配額的重置、復用與末次競態(CWE-840/362)"
owasp: A01/A04 (業務邏輯錯誤+不安全設計;OWASP Top10 2025 A04 視角)
target_type: web_service
phase: verify
payload_policy: methodology-only
side_effect_free: true

summary: >
  全新族:33 套既有 web 劇本沒有一本碰「行銷/交易狀態機」。邀請碼、優惠券、配額
  這類「次數=狀態」的資源,其重置來源通常是:(1)訂單取消/退款流程未回收核銷計數
  ——走完「用碼→取消/退費→再用同一碼」迴圈碼即復活;(2)計數欄位可經物件端點
  直接寫入(Mass Assignment/BOLA 的「寫入面」變體,字段如 use_count/used/quota
  出現在可編輯 JSON 裡);(3)末次核銷的併發競態(兩請求同時過閘,餘額變負)。
  這是 CWE-840 業務邏輯錯誤 + CWE-362 併發的混合族。防禦缺口:核銷計數只存在
  業務層、無事務性約束,WAF 完全無法辨識此類「外形完全合法」的請求,因此本族
  是 WAF 時代少數仍大量存在的漏洞類。受害系統:售票、報名、會員行銷系統。
  本劇本蒸餾自公開通報案例(已去識別化,不含站名/端點名/參數名)。

steps:
  - recon: "行銷語彙盤點(被動):從 HTML/JS bundle 抓取行銷參數與端點語義族(invite/coupon/promo/referral/quota/seat/redemption/code 及其組合命名),記錄哪些回應欄位暴露了『剩餘次數/已使用/狀態』字樣。沿用 JS 呼叫點抽取法(見 web-036):grep bundle 內 fetch/axios 呼叫路徑,聚焦 POST 到核銷/下單/取消動詞的端點。"
  - probe: "狀態迴圈觀察(read-only 下為理論盤點):理想證據是走完『用碼→建立訂單→取消/退費→再用同一碼』完整循環並記錄狀態欄位——但下單/取消均為具副作用的 POST 狀態變更,read-only 圍籬下禁止執行,僅能從前端代碼/API 定義比對狀態機欄位(有無 cancel/refund 路徑回收計數的跡象)。完整迴圈屬 pending-approval,須由操作者以自持帳號在授權明確放行後手動驗證。嚴禁使用非本人取得的碼、嚴禁對他人配額操作。若經放行執行,判定證據必須是同一碼的『核銷成功回應欄位』前後差分(例:used=true→used=false),不是 HTTP 200。"
  - probe: "寫入面差分(受控):比較碼管理/訂單物件的 GET 回應欄位與 PUT/PATCH 可接受欄位——若 GET 暴露的計數欄位(剩餘次數/狀態)出現在寫入端點的可提交結構中且值可影響後續判定,即為 Mass Assignment 候選。read-only RoE 下只做『欄位是否被接受回顯』的理論盤點,實際寫入屬副作用操作,標 pending-approval。"
  - probe: "末次競態(理論盤點,嚴禁實際併發測試):對『最後一次核銷』的端點發兩併發請求即可能透支配額——本劇本只記錄『端點無冪等鍵/無樂觀鎖跡象』(無 If-Match、無 request-id 去重欄位)作為理論線索,不實際併發打。併發施壓即使單次也算 DoS 面,read-only 禁止。"
  - verify: "誤報防呆(核心):『次數復活』可能是業務性失效差異——優惠碼本身有失效時間/時窗判定,跨時窗的『不能用』不是安全控制繞過。立 finding 的必要條件:同一碼、同一帳號、明確的『核銷成功→取消→再次核銷成功』三段證據鏈,且第二段與第一段回應欄位可比對。單 200 不立項。"
  - note: "分級與修復建議:碼復用=medium(財務損失面,可規模化則升 high);計數欄位可寫=high(直接繞過業務控制);競態線索=pending-approval 理論項。修復:核銷計數與訂單狀態放同一資料庫事務、退款流程顯式回收計數並審計、寫入端點白名單欄位(dto 隔離)、末次核銷用 SELECT FOR UPDATE 或分散式鎖+冪等鍵。"
  - reference: "蒸餾自台灣漏洞通報平台之公開通報案例(票務與行銷狀態機設計缺陷;受害站識別資訊已全部去識別化,不含可反向關聯之通報流水號)。CWE-840 (Business Logic Errors) + CWE-362 (Concurrent Execution) + CWE-915 (Mass Assignment)。對應 OWASP ASVS V4.1.3 業務流程驗證、WSTG 4.4 業務邏輯測試章節。"
