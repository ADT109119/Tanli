id: web-042
name: "外包／legacy 入口網站缺陷族分診矩陣:技術堆疊指紋 → 候選缺陷族 → 產業資料敏感度定錨"
owasp: A01/A05/A02 (OWASP Top10 2025 交叉分診)
target_type: web_service
phase: recon
payload_policy: methodology-only
side_effect_free: true

summary: >
  上游分診層:外購／外包製作的形象入口網站與申報登錄平台(醫療、教育、公部門、
  地方局處、中小企業)——legacy PHP/ASP/ASPX + 自建 CMS、上線後無人維運。本劇本
  不新增攻擊手法,解決『一站進來先用什麼順序、先掃哪一族、風險按產業怎麼定錨』:
  (1)技術堆疊指紋定候選族,(2)執行順序=暴露面優先於注入——原始碼暴露(.git/.env/
  SourceMap)直接交付 DB 憑證與內部 API base URL(憑證命中即立案,嚴禁使用外洩憑證直連或呼叫端點),
  那些內部端點就是未授權 API 的地圖,
  先掃暴露面可省掉後面所有盲掃,(3)立案等級綁產業資料敏感度而非只看技術成立與否:
  同一缺陷在醫療／教育／公部門預設升一級,(4)誤報防呆三條(空陣列、遮罩欄位、
  WAF 假陰性)分別回指 web-037/036/038。

steps:
  - recon: "技術堆疊指紋(純被動/單發):副檔名(.php/.asp/.aspx/.jsp)、錯誤頁外形(未標準化 500 頁直接回傳錯誤堆疊=注入反射容易的先行指標)、Cookie 命名慣例(PHPSESSID/ASP.NET_SessionId/JSESSIONID)、Server/X-Powered-By 標頭、目錄索引開啟(Index of /)、舊式參數命名(no/seq/id/sn + 年月日語意)、前端是否 jQuery/ExtJS 時代產物。命中組合直接映射候選缺陷族。"
  - recon: "套裝產品名指紋(純被動前置步驟):登入頁頁尾/版權字串/預設圖樣/版號字串 → 商業套裝或業界套版產品身分判定。命中→`tanli cve <產品名>` 反查該產品公開缺陷族,一站缺陷=同套件所有安裝點的共同缺陷,影響敘事加『同套裝安裝面橫向軸』(以產品類別泛稱,不寫受害站)。與技術堆疊指紋並列:一個答『哪族缺陷』,一個答『屬於何種套裝及其生態衝擊面』——僅做同套件威脅模型推論,嚴禁搜尋、枚舉或探測授權範圍外的第三方安裝點。"
  - probe: "候選族矩陣映射:內容端點(id/no/code/sn 語義參數群)→注入佇列(web-006)、Index of 開啟→目錄索引與活動殘件(web-030)、.git/.env/backup 殘件→版本庫暴露(web-030)、後台路徑慣例(/admin /cms /manage)→控制台暴露(web-032)、詳情端點群→閘門差分(web-036/020)、轉發頭被採信→web-040。每族各出一條最低成本探測,不全站盲掃。"
  - probe: "分診線索直連(跳過中間步驟的捷徑):(a)頁面出現『伺服器端檔案瀏覽/上傳』widget(資料夾樹、縮圖選擇器)→直指 web-043 元件輔助端點族;(b)名單類端點(報名/抽獎/通訊錄/中獎名單)→直指 web-037 欄位投射軸,並將個資密度定錨抬高(郵件/電話欄明文=個資法管轄直接 High 起);(c)受測組織≠軟體作者訊號(廠商設備型號、型錄圖樣、版權第三方公司名)→直指 web-045 孤兒資產/供應鏈軸。"
  - probe: "執行順序鐵律(暴露面優先):1)先掃版本庫/配置暴露(web-030)——.git 暴露直接讀到 DB 憑證、內部 API base URL 與金鑰,等於拿到該站未授權 API 的地圖,後續探測從盲掃變精確打點。煞車鐵律:暴露面命中即立案;嚴禁實際使用外洩憑證直連 DB 或以其呼叫內部端點——外洩憑證只作為影響敘事證據,不做利用;2)再掃目錄索引與殘件;3)最後才是注入與授權差分。反過來的順序(先盲掃注入)浪費探測預算且錯過憑證級情報。"
  - note: "產業資料敏感度定錨(立案紀律):同一技術缺陷,立案等級綁該產業的資料敏感度與法定通報義務——醫療(個資法+醫療資料特種目)、教育(學生個資+未成年)、公部門(公務資料+網域信任)預設升一級起談:in-band SQLi 在形象站=中/高,在上述產業=High 起;另加『同機橫向』觀察——舊站常與掛號/申報等第二應用同主機同 DB 帳號,一族破口映射多應用影響面。"
  - note: "誤報防呆三條:1)詳情端點回空陣列≠有保護(轉 web-037 正樣本對照鐵律,窄窗口先放寬再判 DEAD);2)詳情端點回 200 但欄位全遮罩≠有授權檢查,仍須與未授權基線做形態差分(轉 web-036);3)舊站自訂 500 頁/WAF 遮罩把反射訊號吃掉→布林對照無差異就判無漏洞是假陰性,改走時間盲注對照並做 WAF 覆蓋差分(轉 web-038),嚴禁據此宣告安全。"
  - reference: "候選族分診思路蒸餾自台灣漏洞通報平台之公開通報案例(醫療入口網站內容端點注入、公部門登錄平臺單筆詳情未授權、地方入口網站目錄索引原始碼殘件;受害識別資訊已全部去識別化,不含可反向關聯之通報流水號)。分診順序(暴露面→地圖→精確打點)對應實戰價值排序;產業加權呼應個資法與法定資安通報義務。修復視角:外包專案驗收清單應含『部署排除 .git/備份、錯誤頁標準化、DB 帳號最小權限、詳情端點授權與欄位白名單、退場機制(關站/銷帳)』。"
