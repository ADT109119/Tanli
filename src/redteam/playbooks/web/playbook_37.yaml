id: web-037
name: "日期視窗免登入拉取:存在性洩漏的量級探測與『否定性結果』防呆(A01)"
owasp: A01
target_type: web_service
phase: inject
payload_policy: methodology-only
side_effect_free: true

summary: >
  預約/排程/報表類端點常把「日期區間」當唯一必要參數,而日期不是機密——一旦端點缺
  session 檢查,攻擊者不需要任何個資(卡號/身分證/生日)就能以日期視窗拉回該區間全部
  使用者紀錄。實戰教訓有兩條:(1)量級探測只數筆數、不落地個資;(2)判定「無法重現」
  前必須先用正樣本日期證明查詢機制本身工作,否則會把「該日期本就無資料」誤判成
  「破口已修復」,導致假陰性。

steps:
  - recon: "從 JS/表單找出接受 startdate/enddate(或 beginDate/startDate/年月)的查詢端點,記錄其完整參數外形與是否另有必填欄位。注意:前端強制填卡號不代表後端強制——後端可能只要求日期。"
  - probe: "參數最小化梯度測試:先發完整外形,再逐一移除識別性參數(cardNo/birthday/patientId),保留日期。若僅日期仍回 200+結構化資料,即證明識別參數未進入授權路徑(=無閘門)。每次只改一欄,保持單次受控請求。"
  - probe: "量級探測(守 RoE):選一個已知有資料的正樣本視窗(1 天/30 天/365 天各一筆),只記錄 len(回應陣列) 與是否出現不重複識別碼,嚴禁滑動日期批量拉取、嚴禁將個資寫入檔案或報告(僅留遮罩前 3 碼的最小樣本)。同時探 page/limit/offset/ROWNUM/size 有無生效(對比逐字回應是否位移)——無效=無上限保護,另立 finding。"
  - verify: "無資料線索的過濾參數探測:加一個明显不存在的過濾值(如 deptCode=9999),若回應逐字不變,證明該過濾參數被忽略(伺服器端過濾無效),這會把「小範圍洩漏」升級為「全量可拉」。"
  - note: "否定性結果鐵律:若目標日期回空陣列,必須在『同一端點、同一手法』下用已知正樣本日期做對照組。對照組也空 → 可能已修;對照組有資料 → 是選錯日期,不是破口消失。嚴禁只測無資料區間就宣告 DEAD。此為實戰中真实發生過的假陰性案例。"
  - reference: "本劇源自醫療預約系統實戰:免登入僅憑 startdate+enddate 即回傳含使用者識別碼/姓名/科別/診室/預約序號的完整紀錄,且 deptCode 過濾無效、無筆數上限。對應 OWASP A01、CWE-639 Authorization Bypass Through User-Controlled Key 變體(此處為時間軸枚舉)。修復:查詢端點強制認證+以 session 內病人身份束縛資料範圍、日期區間長度上限、分頁上限、個資欄位最小化回傳。"
