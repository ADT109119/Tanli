id: web-037
name: "日期視窗免登入拉取:存在性洩漏的量級探測與『否定性結果』防呆(A01)"
owasp: A01
target_type: web_service
phase: inject
payload_policy: methodology-only
side_effect_free: true

summary: >
  查詢/報表/排程類端點常把「日期區間」當唯一必要參數,而日期不是機密——一旦端點缺
  session 檢查,攻擊者不需要任何識別參數(證件號/卡號/生日類)就能以日期視窗拉回
  該區間全部紀錄。第二條拉取軸是列表/分頁端點的欄位過度投射(名單類端點回應直接帶
  聯絡欄位+分頁可遞增),同一根因、不同維度。實戰教訓有兩條:(1)量級探測只數筆數、不落地個資;(2)判定
  「無法重現」前必須先用正樣本日期證明查詢機制本身工作,否則會把「該日期本就無
  資料」誤判成「破口已修復」,導致假陰性。

steps:
  - recon: "從 JS/表單找出接受日期區間參數(常見 startdate/enddate、beginDate/endDate、年月日類命名)的查詢端點,記錄其完整參數外形與是否另有必填欄位。注意:前端強制填識別參數不代表後端強制——後端可能只要求日期。"
  - probe: "參數最小化梯度測試:先發完整外形,再逐一移除識別性參數(證件號/卡號/生日/主鍵類),保留日期。若僅日期仍回 200+結構化資料,即證明識別參數未進入授權路徑(=無閘門)。每次只改一欄,保持單次受控請求。"
  - probe: "量級探測(守 RoE):選一個已知有資料的正樣本視窗(1 天/30 天/365 天各一筆),只記錄回應筆數與是否出現不重複識別碼,嚴禁滑動日期批量拉取、嚴禁將個資寫入檔案或報告(識別值一律全遮罩如 [MASKED_ID],僅留首字與長度形態)。同時探 page/limit/offset/size 等分頁參數有無生效(對比逐字回應是否位移)——無效=無上限保護,另立 finding。"
  - probe: "列表/分頁軸:欄位過度投射掃描(與日期視窗軸並列的另一條拉取軸):名單/報名/抽獎/通訊錄類列表端點,對回應欄位做敏感度分級(郵件/電話/身分證明欄/住址類 pattern),與請求有無帶認證解耦評估。分頁參數只需證明可遞增且單頁非固定上限——嚴禁真的把名單拉完:設樣本上限(單頁+兩頁位移對照),命中即停;嚴禁將名冊明文個資寫入日誌/檔案/報告,僅留欄位結構(schema)與遮罩後最小樣本。"
  - verify: "過濾參數無效性探測:加一個明顯不存在的過濾值(如某分類代碼填 9999),若回應逐字不變,證明該過濾參數被忽略(伺服器端過濾無效),這會把『小範圍洩漏』升級為『全量可拉』。"
  - note: "欄位敏感度分級的最高一級是『憑證欄』(補分級缺口):既有分級只有郵件/電話/身分證明欄/住址四類,漏了最致命的一級——回應或匯出欄位裡出現 password/pwd/passwd/可還原口令欄、hash 欄、憑證圖或憑證檔 Base64。憑證欄命中時影響不是『讀到資料』而是『該身分可被冒用』,一律最高級起談。零落地鐵律:證據只留欄位名稱與形態(hash 長度/前綴外形),口令值與 hash 值嚴禁進報告、日誌、工作區檔案——把洩漏物複製進自己的產出物是二次外洩。"
  - note: "識別碼結構可推性防呆(遮罩要按結構走):台灣身分證字號為『字母(首次戶籍登記地)+性別碼(1 男/2 女)+戶政與順序碼+檢查碼』,本身不含出生日期;但殘留段仍能解出性別與登記地,且檢查碼可由其餘欄位算出,部分遮罩會大幅縮小可列舉空間。注意:身分證本身不含出生日期,但常與出生日期欄並列洩漏而交叉可識別——判定一律以『殘留段加上同回應其他欄位能否定位到人』為準。"
  - note: "識別碼證據側遮罩鐵律:留存樣本時識別碼一律全字串遮蔽(僅留首字與長度形態,或直接 [MASKED_ID]),出生日期欄位全數隱蔽,只留欄位名稱與長度——嚴禁只遮前幾碼留下流水號。其他具日期/序列語意的識別碼(戶籍、病歷、學號類)同樣先問『殘留段還能不能解出語意』。"
  - note: "欄位投射立案防呆:前端顯示用的遮罩郵件(a***@example.com 類)與回應體明文欄位要分開計分——只遮罩前端、API 仍回明文=防呆只做在錯誤的一層。快取/CDN 變體可能造成欄位出現/消失的假差異,立案前須直連源站核對同一請求。個資法管轄的欄位(郵件/電話/身分證明)密度直接決定分數,與 web-042 產業定錨綁定。"
  - note: "否定性結果鐵律:若目標日期回空陣列,必須在『同一端點、同一手法』下用已知正樣本日期做對照組。對照組也空 → 可能已修;對照組有資料 → 是選錯日期,不是破口消失。嚴禁只測無資料區間就宣告 DEAD。此為實戰中真實發生過的假陰性案例。"
  - reference: "本劇蒸餾自受控實戰(目標識別資訊已全部去識別化):某生產系統查詢端點免登入僅憑日期區間即回傳含識別碼與個人化欄位的完整紀錄,且過濾參數無效、無筆數上限,已依程序通報。對應 OWASP A01、CWE-639 Authorization Bypass Through User-Controlled Key 變體(時間軸枚舉)。修復:查詢端點強制認證+以 session 內使用者身份束縛資料範圍、日期區間長度上限、分頁上限、回傳欄位最小化。"
