id: web-036
name: "同 Controller 授權閘門差分掃描:找出『漏網的未保護端點』(A01)"
owasp: A01
target_type: web_service
phase: inject
payload_policy: methodology-only
side_effect_free: true

summary: >
  實戰驗證的高命中率手法:同一後端 controller 下的端點群,授權檢查常是逐支撰寫而非
  統一 filter/middleware,於是出現「同組端點中多數有 session 閘門(回固定拒絕碼),
  唯獨某幾支完全沒檢查」的漏網端點。第一命中形態:「列表端點有閘門、單筆詳情端點
  沒有」——外包裝系統逐支寫檢查時,detail 最常被遺忘。做法是先把同 controller 端點
  全部列出,對每一支發「最小合法外形請求」,以回應差異判定伺服器端是否有閘門:有閘門
  回固定拒絕回應(401/403 或自訂拒絕碼+未登入訊息),無閘門則執行業務邏輯(回 200、
  空陣列、或部分欄位)。只要有任何一支無閘門端點能觸發資料查詢,即為 A01 破口。

steps:
  - recon: "端點列舉(被動優先):抓主頁面 + 全部 JS bundle(前端腳本檔),grep AJAX 呼叫的 URL 清單;補以常見 controller 變體探測。產出端點清單:路徑、方法、參數外形(從 JS call site 抄)。詳情端點反推捷徑:從前端路由表與 Swagger/OpenAPI 洩漏(/swagger /v3/api-docs /openapi.json 類慣例路徑)直接列出 detail/info/view/query 語義端點清單——比爬站更容易抓漏,登錄/申報類多租戶平臺尤其高發。"
  - probe: "資源形態差分(先於逐端點盲打):對同一資源的『列表／單筆詳情／匯出／列印』四種形態各發一次最小外形請求,做形態差分而非只看端點差分。第一命中形態:列表回 401/固定拒絕碼、單筆詳情回 200+結構化欄位=直接立案(列表被保護、detail 被遺忘是外包逐支寫授權檢查的經典漏網模式)。匯出/列印形態同規:命中即立案停手,嚴禁後續批量拉取。"
  - probe: "差分閘門測試:對清單中每一支端點,用同一 session(未登入)發一次最小外形請求(參數全填明顯假值如 TEST/19000101,不碰真實個資)。分類回應:A=固定拒絕回應(有閘門)/ B=200+業務結構(無閘門,重點)/ C=500(異常洩漏,另立 finding)/ D=WAF 阻擋(記錄 WAF 覆蓋不一致)。"
  - probe: "'回空陣列不算有保護':無閘門端點回 [] 只證明查詢執行但條件無資料,不證明授權檢查存在。判定伺服器端有無閘門只能看是否出現固定拒絕回應,不能看有無資料。"
  - probe: "'回 200 但欄位全遮罩≠有授權檢查':端點執行了業務邏輯就是無閘門證據,遮罩只是資料層修飾;定性一律與未授權/越權基線做形態差分,嚴禁把『看不到值』直接寫成『端點有保護』。"
  - verify: "對 B 類端點做 proof-of-access:設法人員自有測試帳號或已確認的種子資料做一次受控請求,取得一筆即停(單次、遮罩、不批量),add_finding 附逐字請求+回應(識別欄位採全遮罩:僅留首字與長度形態或直接 [MASKED],嚴禁只遮前幾碼——流水號與檢查碼明文落地即屬強識別資料外洩)。同報告中並列 A 類端點回應作為『閘門存在但覆蓋不一致』的差分證據——這比單獨證明一支無檢查更有說服力。"
  - note: "全模組無閘門 vs 單端點漏網的定級差分:本劇的預設命中形態是『同 controller 中某幾支漏網』(High 起)。若差分掃描顯示該模組從列表到詳情到匯出全數無固定拒絕回應——整條模組從頭到尾沒有閘門——影響面等同該模組全母體,直接 Critical 起談,且敘事要改寫為『該模組從未做過授權設計』而非『某支端點忘記加檢查』;修復建議也隨之從補單點檢查改為補中介層。判定方法沿用既有差分證據,不需要額外探測。"
  - note: "未登入態差分全數回絕≠安全(漏報區鐵律):全數回絕只證明『未認證面有閘門』,不證明該系統無授權缺陷。嚴禁以未登入差分全滅宣告該系統授權面安全。"
  - note: "本劇陰性結果是 web-046 的啟動條件:若目標屬業務系統汰換/新上線期,或手上已有自有合法帳號,必須續跑 web-046 的『認證後』前端角色宣稱差分,兩本互相交叉引用。"
  - reference: "本劇蒸餾自受控實戰(目標識別資訊已全部去識別化):某生產系統同一 controller 下僅少數端點有 session 檢查,其餘查詢端點無保護,已依程序通報。對應 OWASP A01 Broken Access Control、CWE-862 Missing Authorization。修復方向:統一中介層強制認證+授權(deny-by-default),端點級白名單標記公開端點,而非逐支記得加檢查。"
