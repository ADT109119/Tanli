id: web-020
name: "泛 BOLA/IDOR 授權破口盤點:物件層與功能層授權矩陣失效"
owasp: API1/API3/API5 (OWASP API Top10 2023) + A01
target_type: web_service
phase: verify
payload_policy: methodology-only
side_effect_free: true

summary: >
  web-019(發信中繼站)的泛化版:BOLA(Broken Object Level Authorization)/IDOR
  (Insecure Direct Object Reference)是 OWASP API Top 10 連兩屆榜首,核心只有一句話
  ——"伺服器信任了客戶端送來的 ID"。三個變體族:(1)物件層:改 ID 讀/改別人資源
  (/api/order/123 → 124);(2)功能層:一般用戶直呼管理端點(/api/admin/users),
  前端藏選單≠後端驗角色;(3)參數態變體:HTTP 方法改寫(GET /api/user 無效 →
  PUT/DELETE/PATCH 同 URL 繞過路由級檢查)、欄位級洩漏(列表回傳含他人 email/phone)。
  政府/醫療/電商等「多租戶+大量用戶 ID」系統為高危族,因 ID 常為遞增數字或可枚舉;
  「登錄/申報類多租戶平臺」(學校/業者兩端登錄、可枚舉申報編號)同列高危——前端有
  登入流程容易造成「有登入=有授權」錯覺,詳情端點最常漏驗物件層授權。

steps:
  - recon: "API 面繪製(唯讀):從 JS bundle/公開文件/移動端流量抓端點清單,標注每個端點的 ID 型參數(userId/orderId/reportId)與 ID 格式(遞增=可枚舉、UUIDv4=難枚舉、短代號/手機=半可枚舉)。"
  - probe: "授權矩陣假設(防守面思考):合法情況下誰能訪問什麼?找『讀取類』端點做最小探測:不帶憑證呼一次(測功能層)、帶 A 憑證但 ID 填自己(基線 200 特徵)——兩者的 401/403/200 差異就是授權邊界地圖。任何對『他人 ID』的實際讀取在唯讀 RoE 下禁止,僅以『他人 ID 是否回 403 還是 500/200 結構差異』做被動推斷。"
  - probe: "方法/路由變體(觀察型):同 URL 換 HTTP 方法、加 .json/.xml 後綴、復數/單數路徑變體(/api/users/1 vs /api/user/1)、GraphQL introspection(若開放)尋找未掛授權的 resolver。"
  - probe: "欄位級洩漏(回應體審查):列表/詳情端點的回應 JSON 是否多回不該給的欄位(email/phone/idCard/內部 status)。這是『被動就能完成』的 finding,零副作用。"
  - probe: "回應欄位白名單的缺失性觀察:先由前端 JS 渲染邏輯推定『頁面實際消費的欄位集』,回應中超出該集合的欄位=伺服器不做回應欄位白名單的直接證據(前端沒用卻傳給你)。詳情端點與列表端點閘門差分的系統化做法轉 web-036 資源形態差分步驟。"
  - probe: "破壞性寫入端點的零副作用立案法(前置閘門):唯讀 RoE 下一律禁止對『真實存在的資源 ID』發送 POST/PUT/PATCH/DELETE——站端若無授權檢查,一發即永久刪除他人資料,紅線不可妥協。"
  - probe: "方法盤點只走兩條零副作用路徑:(1)OPTIONS 探測讀 Allow 標頭是否開放 DELETE/PUT;(2)對必定不存在的虛構 ID(如 /99999999_PROBE_DUMMY)做方法差分,比對 404/422 與 405——虛構 ID 命中後也嚴禁換成真實 ID 重試。"
  - probe: "破壞性寫入立案法(續,缺失性佐證):前端 JS 是否直接呼叫該刪除端點且未帶額外確認 token/一次性 nonce;OpenAPI/Swagger 定義中該操作的參數與回應欄位形態;有無二次確認流程痕跡。任一命中即立案,一律標 pending-approval。"
  - verify: "確認性測試僅在自有雙帳號環境執行:A 讀 B 的資源成功=finding 成立;或向站方申請授權的滲透範圍放行單次跨帳號讀取(寫入類一律禁止)。證據=兩組封包對照+回應差異。"
  - note: "破壞性寫入煞車(最高優先):嚴禁以『驗證破口存在』為名對真實資源發出 DELETE/PUT/PATCH,也嚴禁對虛構 ID 發出後再換真實 ID 重試。破口成立只需要存在性與缺失性證據,不需要看到刪除真的發生。"
  - note: "租戶邊界不是泛 IDOR(分流鐵律):當『改 ID 讀到的是另一間公司/另一間門市/另一機構』而非同一組織內的另一用戶,那是租戶隔離失效,修復對象與敘事完全不同——轉 web-047(垂直 SaaS 多租戶後台)。tenant/branch/shop/org 類參數的跨租戶實際讀取在任何情況下禁止,僅做狀態碼與欄位形態差分。"
  - note: "定級防呆:破壞性寫入越權不得因『只是刪掉一筆表單資料』定為中。影響是他人權益資格喪失(申請/報名/減免/資格類紀錄被刪即喪失主張依據)加上資料可用性攻擊面(可批量清除他人紀錄),教育/公部門產業一律 High 起談,與 web-042 產業定錨串接。"
  - note: "報告敘事公式:『攻擊者以[身份]透過[端點]改動[參數]即可[讀/改/觸發][他人資源],影響 N 個用戶/可枚舉面 M』——量化的影響面是 bug bounty 定價關鍵。"
  - note: "標準對應:OWASP API Security Top 10 2023 API1(BOLA)/API3(Excessive Data Exposure)/API5(Broken Function Level Authorization);CWE-639、CWE-862 Missing Authorization、CWE-863 Incorrect Authorization。"
  - note: "經典研究與修復:PortSwigger Web Security Academy Access Control 章節、OWASP API Security Project。修復=伺服器端從 session 推導主體、中心化授權中介層(centrally enforced middleware, deny-by-default)、ID 用不可預測值+仍驗授權(防列舉≠防越權)、回應欄位白名單。"
  - reference: "租戶邊界與破壞性寫入立案法蒸餾自台灣漏洞通報平台之公開通報案例(校務系統換版後登入即可刪除他人學費減免申請資料、垂直 SaaS 門市後台租戶邊界失效;受害識別資訊已全部去識別化,不含可反向關聯之通報流水號)。"
