id: web-040
name: "請求來源身份信任缺陷:轉發頭偽造→白名單繞過、稽核汙染、限流規避"
owasp: A01/A05 (以客戶端宣稱的身份做授權決策+安全配置錯誤)
target_type: web_service
phase: inject
payload_policy: methodology-only
side_effect_free: true

summary: >
  全新族:既有劇本完全未觸及「請求來源身份可被用戶端宣告」這條隱性假設。
  應用層直接把轉發頭(X-Forwarded-For / X-Real-IP / Forwarded / Client-IP /
  X-Custom-IP-Authorization 系)當作「客戶 IP」寫入稽核、顯示、判定邏輯,於是:
  (1)「限來源 IP 白名單」的保護端點可被頭偽造繞過(與 web-036 閘門差分串接:
  403 端點注入偽造來源頭後變 200 = 高置信 finding);(2)稽核/日誌/風控記錄被
  汙染,事件溯源失效;(3)按 IP 限流的端點限流規避;(4)「僅內網來源」的
  顯示分支(debug 欄位、內部備註)被誘導開啟。受害系統:政府關聯資訊服務網、
  後台稽核頁、有 IP ACL 的 API。本劇本蒸餾自公開通報案例(已去識別化)。

steps:
  - recon: "來源信任面盤點(被動):找出所有『回顯當前來源』的位置——個人中心登入紀錄、稽核頁、錯誤頁附帶的 client 資訊、驗證碼綁定頁。同時盤點哪些端點回應暗示 IP 判定(403 文案含 IP 白名單字樣、429 按來源限速、debug 欄位顯示 REMOTE_ADDR 類欄位)。"
  - probe: "單發差分(受控、低頻):對回顯來源的頁面帶隨機化轉發頭值(X-Forwarded-For: 203.0.113.<random> 之類 RFC5737 文檔網段),觀察三類差分——(a)回顯『當前來源』的欄位是否跟隨變化(應用層信任證據);(b)白名單保護端點 403→200(最高價值;一旦出現 200 立即停手並立項,嚴禁進一步調用該端點功能或提取深層資料——繞過成功後的任何讀取都已是利用而非驗證);(c)限流閾值行為差異。每類最多 2-3 發,嚴禁批量輪轉頭值(那等於掃描器行為)。"
  - probe: "頭優先級探測(單發):同時帶多個來源頭且值互相衝突(XFF=A、X-Real-IP=B、Client-IP=C),回顯值揭示應用讀哪個頭——決定防禦缺口在哪一層。注意反向代理正規化:前方有 CDN 時轉發頭在邊緣層被覆寫,偽造僅影響後端視角,此時『回顯不變』不能證明安全(後端可能仍信任被覆寫後的鏈),需記錄拓撲差異。"
  - verify: "誤報防呆(核心):回顯差異可能來自快取節點漂移(CDN 邊緣回源 IP 不同)而非頭信任——必須用『多發隨機值對照』歸因:換三個不同隨機值回顯跟隨三個不同值=應用信任證據;回顯固定=快取拓撲效應,不立項。白名單繞過 finding 需要同一端點『不帶頭 403 / 帶偽造頭 200 且內容非緩存頁』的前後對照。"
  - note: "分級與修復:白名單繞過=high/critical(取決於端點敏感度假設);稽核汙染=medium(溯源失效、風控規避);限流規避=low-medium。修復:應用只取反向代理寫入的可信頭(邊緣剝離一切用戶端來源頭後重新附加,即 strip-then-append)、nginx real_ip 模組設可信代理網段、IP ACL 下沉到網路層而非應用讀頭、風控以 mTLS/簽章身份取代 IP 身份。"
  - reference: "蒸餾自台灣漏洞通報平台之公開通報案例(來源 IP 轉發頭信任缺陷;受害站識別資訊已全部去識別化,不含可反向關聯之通報流水號;同案之 SQLi 成分見 web-006)。CWE-290 (Authentication Bypass by Spoofing) + CWE-346 (Origin Validation Error)。對應 WSTG 4.2.3 測試瀏覽識別與會話狀態之用戶端 IP 信任、PortSwigger IP spoofing research。與 web-036(同控制器閘門差分)串接使用。"
