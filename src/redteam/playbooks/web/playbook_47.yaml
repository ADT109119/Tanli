id: web-047
name: "垂直 SaaS 多租戶後台租戶邊界失效:品牌總部—加盟門市—供應商三層拓撲(POS／點餐／店務)"
owasp: A01/A04 (Broken Access Control+不安全設計;租戶隔離屬設計面)
target_type: web_service
phase: recon
payload_policy: methodology-only
side_effect_free: true

summary: >
  全新族:既有 web 劇本沒有一本處理『租戶邊界=門市』這條軸。結構是三方組織拓撲——品牌總部 ≠
  加盟門市 ≠ 雲端 POS/點餐 SaaS 供應商,受測方(門市)既非軟體作者也無修改權限。缺陷形態:後台
  功能層閘門只做在選單與前端,租戶參數(branch/shop/outlet)由客戶端送;一個門市的暴露面就是
  該產品線的共通暴露面。危害要跳出純資料外洩框架:菜單與價格篡改屬交易完整性。
  租戶=門市、受害方無修復權限、同產品線群體暴露是本劇獨佔敘事。

steps:
  - recon: "租戶型後台外形指紋(純被動):端點與域名語彙含 store/branch/outlet/pos/terminal/register/shop 系;參數具門市代號語意的 tenant/branch/shopId;無 CDN 指紋、無框架特徵的廠商自建入口;登入頁掛商家品牌 logo 但版權字串或 domain 屬第三方廠商名——最後一條就是『受測組織≠軟體作者』的直接訊號(轉 web-042 分診直連)。"
  - probe: "免登入可達性判定(單發、狀態碼差分):『登入頁可達』≠『未授權可達』,必須做回應形態差分——有無 302 跳向統一 SSO/入口、有無帶回 tenant 上下文欄位、有無直接回出後台結構。前端選單隱藏不代表後端未掛角色檢查,反過來說選單出現也不代表未授權,嚴禁以 UI 可見性立案。命中(未帶憑證即取得後台結構化內容)即立案停手,嚴禁繼續深入取資料。"
  - probe: "租戶參數邊界的缺失性觀察(嚴禁跨租戶實讀):改 branchId/shopId 去讀另一門市資料在唯讀 RoE 下一律禁止。合法做法是缺失性觀察——同一請求換成明顯不存在的租戶代碼,回應若逐字不變即證明該租戶參數未進入授權路徑(伺服端不做租戶歸屬驗證);並輔以檢視既有初始化/配置回應中是否出現非本門市語意的欄位名稱(不因此追加新請求)。線索成立即立案,不做實際跨租戶讀取。"
  - probe: "交易完整性面盤點(結構盤點,不下單):後台若可達,其寫入面是本店真正的營運控制點——菜單與價格、優惠/折價規則、訂單狀態、員工帳號、對帳與金流串接設定。本步只做功能與路由的唯讀盤點(存在性與欄位形態),任何寫入、改價、下單、退款請求一律禁止並標 pending-approval;這些端點的『可達性』本身就是 High 級敘事,不需要證明能改動。"
  - note: "危害敘事要跳出『資料外洩』單一框架(本族核心):四軸並列——(1)交易完整性:菜單與價格篡改、折價規則竄改直接影響真實成交金額;(2)租戶間資料外洩:訂單明細與會員資料跨越門市邊界;(3)信任污染:門市端對帳與金流串接點的資料可信度受損,事後爭議無從歸責;(4)員工身分面:門市員工帳號多為可推導規則且跨店同構。只寫『個資外洩』會低估此族,也推動不了廠商修復。"
  - note: "POS 離線快取誤報防呆:POS 慣例有離線模式與同步佇列,看似免登入可得的資料可能只是本地快取或前端寫死的展示資料。判定以回應 schema 差分——真後端資料帶伺服端主鍵/時間戳/一致性欄位,本地快取通常是精簡展示形態;未確認 schema 前不得立案為後台資料外洩。"
  - note: "兩層供應鏈修復敘事(與 web-045 並列但不同):此處軟體可改,只是改不動的人是客戶端。門市=受測方與受害方但零修復能力;品牌總部=有資安窗口、有合約談判籌碼但不是軟體擁有方;雲端供應商=缺陷擁有方,同產品線所有加盟體系共用同一套後台。報告要雙開單:門市面走補償性控制(前置反向代理加認證、來源 IP 限制、把後台移出可路由範圍),廠商面走產品級缺陷通報(租戶隔離與功能層閘門)。資產面與廠商面分開立案,單站低風險、同產品線群體高風險。"
  - note: "停火鐵律:任何一步疑似取得到非自有門市的真實資料(回應出現他人門市訂單/會員欄位值),立即停止該端點一切後續請求並轉通報——與 web-044 停火精神同源。"
  - note: "繞過成功後的讀取即屬利用:閘門繞過或租戶參數越界成功之後,任何進一步讀取都已是利用而非驗證,不得以『再多取一筆確認』為由續讀。"
  - note: "盤點指紋速查(本劇自用):store/branch/outlet/pos/terminal/register 語彙、門市編號語意的 tenant 參數、無 CDN 無框架指紋的廠商自建入口、品牌 logo 配第三方版權字串。命中任一即啟動本劇,不要從注入開始掃。"
  - reference: "本劇蒸餾自台灣漏洞通報平台之公開通報案例(連鎖餐飲加盟體系使用的雲端點餐系統 POS 後台可免登入直達;通報受測方是門市,軟體作者另有其公司;受害識別資訊已全部去識別化,不含可反向關聯之通報流水號)。邊界切割避免重疊:單組織內使用者級授權差異→web-020/web-036;設備內嵌 Web UI 與前端金鑰承載→web-045;主站認證清單外的元件輔助端點→web-043;換版期認證後真空→web-046。本劇獨佔:租戶=門市、受害方無修復權限、同產品線群體暴露。"
  - reference: "產業定錨(餐飲/零售門市端未授權存取起 High)轉 web-042;租戶邊界的缺失性觀察手法轉 web-020。"
