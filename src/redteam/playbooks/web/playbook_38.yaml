id: web-038
name: "WAF 覆蓋差分探測 + 反射參數進入 JS 字串的『語法破壞』判定(A01/A05)"
owasp: A01/A05
target_type: web_service
phase: recon
payload_policy: methodology-only
side_effect_free: true

summary: >
  兩件相輔的小手法,皆為實戰驗證:(1)WAF 覆蓋不一致探測——同一參數名/同一 payload
  换到不同參數名或不同端點,WAF 可能只擋其中一部分,於是「被擋」不代表「安全」,
  「沒被擋」也不代表「無漏洞」,要畫出覆蓋矩陣才下結論。(2)反射參數進入 JS 字串
  而非 HTML 上下文時,單引號被 HTML encode(變 &#39;)不代表安全——反斜線等不需
  encode 的字元仍可提前閉合字串、破壞 JS 語法(回傳的 script 段語法错误),這是
  CSP 存在時仍成立的「非 XSS 但可破壞頁面邏輯/探測注入面」證據,須如實分級記錄。

steps:
  - recon: "WAF 特徵基線:發一個明顯攻擊性 payload(如 ' OR 1=1 --)確認 WAF 存在與其攔截外形(常見 200+阻擋頁/403/418/自訂 block 頁)。注意 200+阻擋頁=防禦生效,記錄為防禦證據而非漏洞。"
  - probe: "覆蓋矩陣(受控):同一 payload 分別放進不同參數名(如 a=, 同值換 b=)、不同端點、不同 Content-Type、不同大小寫/編碼變體,記錄每格 WAF 是否攔截。產出矩陣後只報告『不一致』本身:覆蓋不一致=可被規避的訊號,但不要在報告裡提供繞過 payload。"
  - probe: "反射上下文判定:給每個反射參數餵獨一無二標記(如 abc123xyz),回傳後定位標記出現位置——HTML 文字 / HTML 屬性 / JS 字串 / URL / JSON。JS 字串內再測特殊字元的 encode 行為:' 是否變 &#39;、\\ 是否原樣保留、</script> 是否可用。反斜線原樣保留=可閉合字串=語法破壞面成立。"
  - verify: "語法破壞 vs XSS 分級:JS 字串內只能破壞語法(引号被 encode)→ 立 medium/low finding(用戶可控內容破壞腳本執行,可致功能異常/錯誤訊息洩漏),嚴禁誇大為 XSS。能實際閉合字串執行任意碼才升 high/critical。報告用詞要誠實:『反射但被 encode,反斜線可破壞 JS 語法』。"
  - note: "WAF 一致性也是防護建議的一部分:報告應建議『規則以內容為中心而非參數名為中心』,並把 WAF 定位為深度防禦的一層而非唯一依賴(源頭仍需輸出編碼+CSP)。"
  - reference: "本劇源自醫療系統實戰:quoted 參數被 WAF-Blocker 阻擋但同族參數名未全覆盖;反射參數進入 JS 字串,單引號變 &#39; 但反斜線保留可斷句。對應 OWASP A05(安全配置錯誤——WAF 規則覆蓋不一致)、A01(以 WAF 代替授權)。CWE-80 弱化變體/CWE-79 上下文判定。"
