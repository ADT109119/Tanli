id: web-045
name: "邊界內孤兒資產盤點:廠商內嵌設備與自架服務(BMS/OT/實驗室運算/除錯入口)與其前端金鑰"
owasp: A05/A02 (OWASP Top10 2025 安全配置錯誤+認證失敗之資產管理面)
target_type: web_service
phase: recon
payload_policy: methodology-only
side_effect_free: true

summary: >
  校園／廠區邊界內存在一類『受測組織 ≠ 軟體作者、也不是自己網頁團隊建置』的資產:廠商交付的
  BMS/能源管理/儀表設備內嵌 Web UI、研究單位自架的運算/實驗服務(常把除錯入口暴露在網路上、
  同時只靠弱口令守門)。它們不在 Web 資產清冊、不在 WAF 後面、韌體不可改,資安團隊常不知其存在。
  本劇管這條『資產孤兒』盤點軸:(1)孤兒資產外形指紋,(2)前端第三方金鑰承載模式分類,
  (3)除錯入口+弱口令的缺失性立案(沿用 web-032 不試口令紀律)。與 web-032(控制台面)、
  web-030(金鑰暴露)互補:這裡的根因是資產盤點缺口,不是單點配置錯誤。

steps:
  - recon: "孤兒資產外形指紋(純被動):非標準埠、路徑含除錯語彙(debug/console/trace/test 類)、回應無 CDN 指紋無框架特徵、TLS 憑證為自簽或校內 CA、主機名含設備/實驗室語意(monitor/lab/device/型號類)。來源限定於既有授權範圍內的被動觀察與公開資訊,不為找孤兒而擴大掃描面。命中敘事:該資產大概率不在組織 Web 清冊——『沒人知道它存在』本身就是發現。"
  - recon: "孤兒資產來源另列一類(純被動):大專校院學生自治組織/社團自營系統(器材借用、活動報名、獎助學金類)——指導老師簽核上線、靠學生交接而知識斷鏈、無專職資安人力、掛學校可信網域,同樣不在學校 IT 資產清冊。"
  - recon: "學生自治系統指紋:校內子路徑＋自治單位命名語意(society/club/council/loan 系)＋無人維運跡紋(沿用 web-032 殭屍站判定:過期年份字串、TLS 憑證過期、Last-Modified 停滯)。存的是成員名冊與弱勢自陳申請資料,修復門檻低(補中介層即可)。"
  - probe: "前端第三方金鑰承載分類(被動):JS bundle 與執行期 XHR 的『第三方 host 抽離』,依承載模式分類——標頭 Authorization / 自訂 X-API-KEY 類 / query 參數 key= 類。注意坑:同名多段欄位抓錯 key(對照 web-038 同類教訓)。判定規則:地圖磚類公開 key(無計量)與有配額/計量 key 分開計分;嚴禁主動構造請求打第三方服務驗證 key——那會變成對非授權目標發包,紅線。"
  - probe: "除錯入口+弱口令的缺失性立案(零嘗試):自架服務暴露除錯/管理入口且唯一防護是口令時,沿用 web-032 方法論——缺失性觀察(公網/邊界可達+無來源限制+無第二因子)立『暴露與認證防護不足』finding;嚴禁試任何口令(一發即憑證攻擊);口令線索僅接受文件化證據(公開操作手冊/論文附錄/部署說明文件寫死的預設口令),命中一律標 pending-approval 立案退場,嚴禁使用該文件化口令發起真實登入驗證。"
  - note: "『key 可見』≠『key 可濫用』(立案防呆):無擁有方用量日誌時一律 CANDIDATE＋影響面推論,不可 CONFIRM。影響敘事三軸沿用 web-030 LLM 金鑰三軸的泛化版:計費濫用／資料出境給第三方／配額耗盡導致服務中斷(對 OT/監控設備即監控失效)。"
  - note: "兩層供應鏈敘事(核心框架):受測組織只是設備『使用者』,韌體不可改、廠商不給源碼——修復路徑與一般 Web 缺陷完全不同,報告修復建議要寫對對象:隔離(專用 VLAN/防火牆規則把設備移出可路由範圍)、供應商協同通報(產品級缺陷影響同產品線所有安裝點,敘事走『設備出貨面』)、以補償性控制(前置反向代理加認證)替代不可改的韌體。資產面與廠商面分開開單,單站低風險、同產品線群體高風險。"
  - reference: "資產孤兒與前端金鑰軸蒸餾自台灣漏洞通報平台之公開通報案例(校園內廠商能源管理設備前端洩漏第三方服務金鑰、大專自架運算設備除錯入口＋弱口令;受害識別資訊已全部去識別化,不含可反向關聯之通報流水號)。與 web-042 分診矩陣串接:發現『受測組織≠軟體作者』訊號(廠商設備型號、型錄圖樣)時升格本劇。"
