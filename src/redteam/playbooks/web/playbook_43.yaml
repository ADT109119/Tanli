id: web-043
name: "前端元件反推的隱藏檔案操作端點:富文本(WYSIWYG)編輯器／檔案管理器 connector 免登入暴露族"
owasp: A01/A05 (OWASP Top10 2025 存取控制+注入之元件攻擊面)
target_type: web_service
phase: recon
payload_policy: methodology-only
side_effect_free: true

summary: >
  蒸餾自公開通報案例(去識別化):外包套版站把富文本編輯器／檔案管理器解壓即裝時,套件自帶的
  輔助端點(connector 型目錄／檔案操作 API)幾乎從未被站方納入認證範圍——成立條件是
  『元件存在即暴露』,不需憑證、不需注入、不需 XSS。本劇管『盤點內嵌元件 → 被動指紋 →
  輔助端點單發存在性判定 → 版號 CVE 交叉』這條鏈,與 web-013(sanitizer 信任邊界)、
  web-027(WordPress 生態)互補:這裡打的是『隨套件部署、卻不在主站 auth 清單上的輔助端點』。
  上游由 web-042 分診矩陣的『伺服器端檔案瀏覽 widget』線索接入。

steps:
  - recon: "內嵌元件盤點(純被動):站內 script src／CSS 路徑掃編輯器與檔案管理器慣例詞(editor/fckeditor/ckfinder/ueditor/kindeditor 類目錄、skins/images 資源路徑),頁面 DOM 是否出現『瀏覽伺服器端檔案／上傳』widget(資料夾樹、縮圖選擇器)。元件清單與網站清單分立:『廠商套版時裝進來的東西』在站長心智模型裡不存在,這是元件部署面與主站認證面互不相交的根因敘事。"
  - probe: "輔助端點存在性判定(單發、唯讀):connector 型端點以功能路由引數單發(目錄讀取語義的 list/thumbnail 類命令),觀察免登入態回應 schema——合法元件 schema 且含目錄條目 = 暴露成立,立即立案。紅線:只發單層唯讀命令;上傳／寫入類子命令一律不發;嚴禁遞迴遍歷目錄樹、嚴禁請求或下載清單中列出的任何實體檔案——證據僅記錄回應的目錄 schema 與條目計數。暴露本身就是 finding,上傳成功與否不是立案條件,嚴禁以『證明危害』名義寫檔。"
  - probe: "前端 JS 存在≠後端已部署(誤報防呆一):編輯器 JS 放在前端目錄不代表伺服器端已部署 connector——connector 通常是伺服器端腳本(php/aspx/jsp 變體共存)。判別只看回應結構差分:回應為合法元件 schema(目錄條目 JSON/XML)才算暴露;SPA catch-all 回 index HTML、WAF 200 封鎖頁、CMS 把未知路徑當成前端路由,都不是暴露(沿用 web-042 防呆精神)。"
  - probe: "403≠已修＋同名多副本陷阱(誤報防呆二／三):connector 回 403 只證明該入口被擋,不證明版號已修(可能另有路徑或另一份副本);同站常有多份同名元件副本(前端目錄 vs 後台目錄版本不同),掛 CVE 前必須先確認『被頁面實際引用的那一份』(順頁面引用路徑定位)——把已知 CVE 掛到錯誤版號是最常見的立案錯誤。"
  - probe: "版號 → CVE 交叉比對(離線查詢,零目標流量):版號指紋命中即走 `tanli cve <元件名>` 三源反查(GHSA/OSV/NVD)已知缺陷族;已知『未驗證上傳』類 CVE(副檔名檢查繞過 lineage)只做版號範圍比對,嚴禁動態驗證其可利用性——版號命中 = CANDIDATE,寫入路徑的動態驗證違反本劇紅線。"
  - note: "立案與敘事:免登入檔案／目錄操作端點 = High 起談(目錄清單可列舉全站檔案與歷史上傳;寫入能力存在即 webshell 升級路徑,但無須展示)。根因敘事寫『元件部署面與主站認證面是兩個不相交的清單』;修復:connector 納入主站認證(session+角色驗證)或刪除不必要的元件伺服器端腳本,反向代理對輔助路徑統一 deny。交叉引用 web-032(控制台暴露)、web-044(上傳目錄發現異常痕跡時立即轉取證判讀並停火)。"
  - reference: "手法輪廓蒸餾自台灣漏洞通報平台之公開通報案例(富文本編輯器／檔案管理器未授權暴露與未驗證上傳缺陷簇;受害識別資訊已全部去識別化,不含可反向關聯之通報流水號)。外掛式套件自帶管理 API 脫離認證範圍,是外包／legacy 站反覆出現的結構性缺口。"
